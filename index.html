    <script>
      // Gracefully prevent OneSignal origin/domain mismatch errors from crashing the app or flagging as unhandled in dev/preview environments
      window.addEventListener('error', function(event) {
        if (event.message && (event.message.includes('gigupnigeria.com') || event.message.includes('OneSignal') || event.message.includes('used on'))) {
          event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        const msg = event.reason && (event.reason.message || event.reason.toString() || '');
        if (msg && (msg.includes('gigupnigeria.com') || msg.includes('OneSignal') || msg.includes('used on'))) {
          event.preventDefault();
        }
      }, true);

      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        try {
          await OneSignal.init({
            appId: "1ed9f951-1289-4c70-8cf2-d7b03721d553",
            safari_web_id: "web.onesignal.auto.0908e376-c893-48cd-92f7-007572df5c49",
            notifyButton: {
              enable: false,
            },
            welcomeNotification: {
              disable: true,
            },
          });
        } catch (err) {
          console.warn('OneSignal initialization skipped or failed:', err);
        }
      });
    </script>
